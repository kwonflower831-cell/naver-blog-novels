name: 소설 원고 집필 지침 자동 점검

on:
  push:
    branches: [main]
    paths:
      - "novel-yupum-text/*.txt"
      - "novel-lasttalk-text/*.txt"
      - "novel_checker.py"
      - "ci_report.py"
      - ".github/workflows/novel-check.yml"
  pull_request:
    paths:
      - "novel-yupum-text/*.txt"
      - "novel-lasttalk-text/*.txt"
      - "novel_checker.py"
      - "ci_report.py"
  schedule:
    - cron: "0 0 * * *" # 매일 한국 시간 오전 9:00 (UTC 00:00)
  workflow_dispatch:

jobs:
  check-novels:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 원고 서식·분량·지침 일괄 검증 및 요약 리포트
        run: python ci_report.py
